name: Update Website Downloads

on:
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    # Installers may be uploaded after the release is published.
    - cron: '17 * * * *'
  push:
    branches: [stable]
    paths:
      - '.github/workflows/deploy-website.yml'
      - 'apps/clipcy-website/scripts/sync-release.mjs'
      - 'apps/clipcy-website/tests/**'
      - 'apps/clipcy-website/package*.json'

permissions:
  contents: write

concurrency:
  group: website-downloads
  cancel-in-progress: false

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/clipcy-website/package-lock.json

      - name: Install dependencies
        working-directory: apps/clipcy-website
        run: npm ci

      - name: Verify release selection
        working-directory: apps/clipcy-website
        run: npm test

      - name: Update available installer links
        working-directory: apps/clipcy-website
        run: npm run sync-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify website build
        working-directory: apps/clipcy-website
        run: npm run build

      - name: Commit download updates for Netlify
        shell: bash
        run: |
          if git diff --quiet -- apps/clipcy-website/src/release.json; then
            echo 'Download links already match the latest complete release.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/clipcy-website/src/release.json
          git commit -m 'chore(website): update release download links'
          git push origin HEAD:stable
